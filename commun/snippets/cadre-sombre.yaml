# ─────────────────────────────────────────────────────────────────────────────
#  Cadre sombre autour de plusieurs cartes (card-mod)        ✔ utilisé
#  Regroupe plusieurs cartes dans un seul cadre #161618 : coins 16 px, liseré
#  discret, sans ombre. Les cartes internes sont rendues transparentes, de
#  sorte qu'il ne reste qu'un cadre. Fonctionne avec n'importe quel thème sombre.
#  Prérequis : card-mod (fournit custom:mod-card), Mushroom pour le titre.
#  Adapter la couleur, l'arrondi et les cartes internes au besoin.
# ─────────────────────────────────────────────────────────────────────────────
type: custom:mod-card
card_mod:
  style: |-
    ha-card {
      background: #161618 !important;
      border-radius: 16px !important;
      border: 1px solid rgba(255,255,255,0.06) !important;
      box-shadow: none !important;
      padding: 6px !important;
      margin: 0 !important;
    }
card:
  type: vertical-stack
  cards:
    - type: custom:mushroom-title-card
      title: Mon bloc
      card_mod:
        style: |-
          ha-card {
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
          }
    - type: entities
      entities:
        - entity: sun.sun
      card_mod:
        style: |-
          ha-card {
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
          }
