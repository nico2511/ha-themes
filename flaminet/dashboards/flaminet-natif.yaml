# Dashboard « Flaminet natif » — exemple anonymisé et réduit du dashboard « 9.0 Flaminet ».
# Style : uniquement des cartes natives HA (sections, heading, tile, shortcut, markdown),
# couleurs nommées de HA, thème par défaut (ou « flaminet ») en mode sombre.
# Aucune carte HACS requise. URL supposée : /dashboard-maison (adapter back_path et navigation_path).
# Vues gardées : Maison, Lumières, Baie serveur, Prises, Système (caméras, alarme détaillée,
# 3D, aspirateur, pièces et média retirés de l'exemple). Entity_id génériques à remplacer.
# Note : script.notify_maison est un script perso (badge « Notifier »), à remplacer ou retirer.
title: Maison
views:
- title: Maison
  path: home
  type: sections
  icon: mdi:home-heart
  max_columns: 2
  header:
    layout: responsive
    badges_position: bottom
    card:
      type: markdown
      text_only: true
      content: '{% set j = [''Lundi'',''Mardi'',''Mercredi'',''Jeudi'',''Vendredi'',''Samedi'',''Dimanche''] %}{% set m = [''janvier'',''février'',''mars'',''avril'',''mai'',''juin'',''juillet'',''août'',''septembre'',''octobre'',''novembre'',''décembre''] %}# Maison


        {{ j[now().weekday()] }} {{ now().day }} {{ m[now().month - 1] }} · {{ state_attr(''weather.forecast_maison'',''temperature'') }}°'
  badges:
  - type: entity
    entity: person.personne_1
    show_name: true
    show_entity_picture: true
  - type: entity
    entity: person.personne_2
    show_name: true
    show_entity_picture: true
  - type: entity
    entity: weather.forecast_maison
  - type: entity
    entity: alarm_control_panel.alarme_maison
  - type: entity
    entity: sensor.telephone_batterie
    name: Téléphone
  - type: shortcut
    text: Notifier
    icon: mdi:bell-ring
    tap_action:
      action: perform-action
      perform_action: script.notify_maison
      data:
        title: Test notification
        message: Notification de test.
        notification_id: test_notif
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Maison
      heading_style: title
      icon: mdi:home
      badges:
      - type: entity
        entity: binary_sensor.pc_bureau
        show_state: true
      - type: entity
        entity: binary_sensor.nas
        show_state: true
    - type: tile
      entity: weather.forecast_maison
      grid_options:
        columns: full
        rows: 2
      name: Météo
      features:
      - type: temperature-forecast
        forecast_type: daily
        days_to_show: 5
    - type: tile
      entity: person.personne_1
      grid_options:
        columns: 6
      name: Personne 1
      vertical: true
    - type: tile
      entity: person.personne_2
      grid_options:
        columns: 6
      name: Personne 2
      vertical: true
    - type: tile
      entity: alarm_control_panel.alarme_maison
      grid_options:
        columns: 12
      name: Alarme
      features:
      - type: alarm-modes
        style: icons
    background: true
  - type: grid
    cards:
    - type: heading
      heading: Contrôle rapide
      heading_style: title
      icon: mdi:tune
    - type: tile
      entity: light.toutes_les_lumieres
      grid_options:
        columns: 12
      name: Tout éteindre
      icon: mdi:lightbulb-off
      features:
      - type: toggle
      color: red
    - type: tile
      entity: switch.switch_bureau_pc
      grid_options:
        columns: 6
      name: Prise PC
      icon: mdi:desktop-tower
      features:
      - type: toggle
    - type: tile
      entity: binary_sensor.pc_bureau
      grid_options:
        columns: 6
      name: PC bureau
      icon: mdi:desktop-classic
    - type: tile
      entity: switch.cameras
      grid_options:
        columns: 6
      name: Caméras
      icon: mdi:cctv
      features:
      - type: toggle
    - type: tile
      entity: binary_sensor.serveur
      grid_options:
        columns: 6
      name: Serveur
      icon: mdi:server
    - type: tile
      entity: binary_sensor.nas
      grid_options:
        columns: 6
      name: NAS
      icon: mdi:nas
    - type: tile
      entity: switch.switch_chambre_tv
      grid_options:
        columns: 6
      name: TV chambre
      icon: mdi:television
      features:
      - type: toggle
    - type: tile
      entity: switch.switch_meuble_tele
      grid_options:
        columns: 6
      name: Meuble télé
      icon: mdi:television-classic
      features:
      - type: toggle
    background: true
  - type: grid
    cards:
    - type: heading
      heading: Aller à
      heading_style: title
      icon: mdi:arrow-right-bold-circle
    - type: shortcut
      text: Lumières
      icon: mdi:lightbulb-group
      grid_options:
        columns: 6
        rows: 1
      color: amber
      tap_action:
        action: navigate
        navigation_path: /dashboard-maison/lumieres
    - type: shortcut
      text: Prises
      icon: mdi:power-socket-fr
      grid_options:
        columns: 6
        rows: 1
      color: teal
      tap_action:
        action: navigate
        navigation_path: /dashboard-maison/prises
    - type: shortcut
      text: Baie serveur
      icon: mdi:server
      grid_options:
        columns: 6
        rows: 1
      color: grey
      tap_action:
        action: navigate
        navigation_path: /dashboard-maison/serveur
    - type: shortcut
      text: Système
      icon: mdi:cog
      grid_options:
        columns: 6
        rows: 1
      tap_action:
        action: navigate
        navigation_path: /dashboard-maison/systeme
    column_span: 2
    background: true
