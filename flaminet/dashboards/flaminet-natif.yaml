      badges:
      - type: entity
        entity: binary_sensor.serveur
    - type: tile
      entity: binary_sensor.serveur
      grid_options:
        columns: 6
      name: Ping serveur
    - type: tile
      entity: sensor.garage_prise_serveur_consommation_actuelle
      grid_options:
        columns: 6
      name: Puissance
      features:
