- title: Baie serveur
  path: serveur
  type: sections
  icon: mdi:server
  max_columns: 2
  subview: true
  back_path: /dashboard-maison/home
  sections:
  - type: grid
    cards:
    - type: heading
      heading: État
      heading_style: title
