# Dashboard « MediaTracker » v5 — style « console sombre » (cartes #161618, grid-layout desktop 3 colonnes)
# Ancienne version (remplacée par mediatracker-flaminet.yaml), conservée comme exemple de style.
# Prérequis : button-card, Mushroom, card-mod, layout-card (custom:grid-layout), mod-card (card-mod).
# À coller dans : dashboard → ⋮ → Modifier → ⋮ → Éditeur de configuration brute (remplace tout). Aucun secret ni IP.
button_card_templates:
  mt_bouton:
    show_name: true
    show_icon: true
    size: 16px
    variables:
      nas_requis: true
    triggers_update:
    - binary_sensor.nas
    styles:
      card:
      - height: 34px
      - padding: 0 10px
      - border-radius: 10px
      - box-shadow: none
      - background: rgba(255,255,255,0.06)
      - opacity: '[[[ return (variables.nas_requis && states[''binary_sensor.nas''] && states[''binary_sensor.nas''].state !== ''on'') ? 0.45 : 1 ]]]'
      name:
      - font-size: 12px
      - font-weight: '500'
      - color: '#e8e8ee'
      icon:
      - width: 16px
      - color: '#d0d0d6'
      grid:
      - grid-template-areas: '"i n"'
      - grid-template-columns: 16px 1fr
      - column-gap: 6px
      - align-items: center
      - justify-items: center
  mt_affiche:
    icon: mdi:image-outline
    show_entity_picture: true
    show_icon: true
    show_name: false
    show_state: true
    entity_picture: '[[[ const picture = String((entity.attributes && entity.attributes.entity_picture) || ''''); return /^https?:\/\//.test(picture) ? picture : ''''; ]]]'
    tap_action:
      action: url
      url_path: '[[[ return entity.attributes.tmdb_url || '''' ]]]'
    styles:
      card:
      - width: 76px
      - height: 132px
      - padding: 4px
      - box-shadow: none
      - background: '#2a2a2e'
      - border-radius: 10px
      - border: '[[[ return String(entity.state).endsWith(''· suivi'') ? ''1px solid rgba(134,239,172,0.55)'' : ''1px solid transparent'' ]]]'
      - display: '[[[ const s = entity ? String(entity.state) : ''''; return [''—'',''unknown'',''unavailable'',''''].includes(s) ? ''none'' : ''block'' ]]]'
      entity_picture:
      - width: 68px
      - height: 100px
      - object-fit: cover
      - border-radius: 8px
      - justify-self: center
      icon:
      - width: 28px
      - color: '#8b8b93'
      state:
      - font-size: 10px
      - white-space: normal
      - overflow: hidden
      - max-height: 26px
      - line-height: 13px
      - color: '[[[ return String(entity.state).endsWith(''· suivi'') ? ''#86efac'' : ''var(--primary-text-color)'' ]]]'
title: MediaTracker
views:
- title: MediaTracker
  path: mediatracker
  type: custom:grid-layout
  layout:
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1fr)
    grid-template-rows: auto auto 1fr
    grid-template-areas: |-
      "status downloads suivre"
      "status watch queue"
      "sorties watch antenne"
    grid-gap: 12px
    place-items: start stretch
    align-content: start
    max-width: 1500px
    margin: 0 auto
    mediaquery:
      '(max-width: 839px)':
        grid-template-columns: 100%
        grid-template-rows: auto
        grid-template-areas: |-
          "status"
          "downloads"
          "watch"
          "sorties"
          "antenne"
          "suivre"
          "queue"
        place-items: start stretch
  cards:
  - type: custom:mod-card
    view_layout:
      grid-area: status
    card_mod:
      style: |-
        ha-card {
          background: #161618 !important;
          border-radius: 16px !important;
          border: 1px solid rgba(255,255,255,0.06) !important;
          box-shadow: none !important;
          padding: 6px !important;
          margin: 0 !important;
        }
    card:
      type: vertical-stack
      cards:
      - type: custom:mushroom-title-card
        title: MediaTracker
        card_mod:
          style: |-
            ha-card {
              background: transparent !important;
              box-shadow: none !important;
              border: none !important;
              margin: 0 !important;
              --title-padding: 6px 8px 2px;
              --title-font-size: 15px;
            }
      - type: custom:mushroom-chips-card
        chips:
        - type: template
          entity: binary_sensor.nas
          icon: mdi:nas
          icon_color: '{{ ''green'' if is_state(''binary_sensor.nas'', ''on'') else ''red'' }}'
          content: NAS {{ 'allumé' if is_state('binary_sensor.nas', 'on') else 'éteint' }}
          tap_action:
            action: more-info
        - type: template
          entity: sensor.mediatracker_version
          icon: '{% set u = state_attr(''sensor.mediatracker'', ''update'') %}{{ ''mdi:arrow-up-circle'' if u is mapping and u.get(''available'') else ''mdi:check-circle-outline'' }}'
          icon_color: '{% set u = state_attr(''sensor.mediatracker'', ''update'') %}{{ ''amber'' if u is mapping and u.get(''available'') else ''grey'' }}'
          content: '{% set u = state_attr(''sensor.mediatracker'', ''update'') %}{% if u is mapping and u.get(''available'') %}MAJ disponible{% else %}Aucune MAJ signalée{% endif %}'
          tap_action:
            action: more-info
        card_mod:
          style: |-
            ha-card {
              background: transparent !important;
              box-shadow: none !important;
              border: none !important;
              padding: 0 6px 4px !important;
              --chip-background: rgba(255,255,255,0.06);
              --chip-box-shadow: none;
              --chip-border-width: 0;
              --chip-height: 28px;
              --chip-font-size: 12px;
            }
      - type: conditional
        conditions:
        - condition: state
          entity: binary_sensor.nas
          state: 'off'
        card:
          type: markdown
          content: 'NAS éteint : les chiffres ci-dessous sont figés. Un suivi demandé maintenant part en file d''attente et s''envoie dès que le NAS répond.'
          card_mod:
            style: |-
              ha-card {
                background: rgba(124,74,3,0.25) !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 12px !important;
                margin: 0 0 4px 0 !important;
              }
              ha-markdown { padding: 8px 10px !important; font-size: 12px; color: #fdba74; }
      - type: conditional
        conditions:
        - condition: state
          entity: binary_sensor.nas
          state: 'on'
        - condition: state
          entity: sensor.mediatracker_sante
          state_not: ok
        card:
          type: markdown
          content: '{% set h = state_attr(''sensor.mediatracker'', ''health'') %}Santé : {{ states(''sensor.mediatracker_sante'') }}{% if h is mapping and h.get(''component'') %} ({{ h.get(''component'') }}){% endif %}{% if h is mapping and h.get(''message'') %} — {{ h.get(''message'') }}{% endif %}'
          card_mod:
            style: |-
              ha-card {
                background: rgba(124,74,3,0.25) !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 12px !important;
                margin: 0 0 4px 0 !important;
              }
              ha-markdown { padding: 8px 10px !important; font-size: 12px; color: #fdba74; }
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr 1fr
          grid-gap: 8px
          place-items: stretch
          mediaquery:
            '(min-width: 840px)':
              grid-template-columns: repeat(2, minmax(0, 1fr))
        card_mod:
          style: |-
            ha-card {
              background: transparent !important;
              box-shadow: none !important;
              border: none !important;
              padding: 0 !important;
              margin: 0 !important;
            }
        cards:
        - type: custom:mushroom-entity-card
          entity: sensor.mediatracker_sante
          name: Santé
          icon: mdi:heart-pulse
          icon_color: '{{ ''green'' if is_state(''sensor.mediatracker_sante'', ''ok'') else (''red'' if states(''sensor.mediatracker_sante'') in [''indisponible'', ''unavailable'', ''unknown''] else ''amber'') }}'
          layout: horizontal
          primary_info: name
          secondary_info: state
          card_mod:
            style: |-
              ha-card {
                background: rgba(255,255,255,0.04) !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 12px !important;
                margin: 0 !important;
                --icon-size: 22px;
                --card-primary-font-size: 13px;
                --card-secondary-font-size: 12px;
              }
        - type: custom:mushroom-entity-card
          entity: sensor.mediatracker_disque
          name: Disque
          icon: mdi:harddisk
          icon_color: amber
          layout: horizontal
          primary_info: name
          secondary_info: state
          card_mod:
            style: |-
              ha-card {
                background: rgba(255,255,255,0.04) !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 12px !important;
                margin: 0 !important;
                --icon-size: 22px;
                --card-primary-font-size: 13px;
                --card-secondary-font-size: 12px;
              }
        - type: custom:mushroom-entity-card
          entity: sensor.mediatracker_version
          name: Version
          icon: mdi:tag-outline
          icon_color: purple
          layout: horizontal
          primary_info: name
          secondary_info: state
          card_mod:
            style: |-
              ha-card {
                background: rgba(255,255,255,0.04) !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 12px !important;
                margin: 0 !important;
                --icon-size: 22px;
                --card-primary-font-size: 13px;
                --card-secondary-font-size: 12px;
              }
          view_layout:
            grid-column: 1 / -1
      - type: horizontal-stack
        cards:
        - type: custom:button-card
          template: mt_bouton
          name: Vérifier MAJ
          icon: mdi:update
          tap_action:
            action: call-service
            service: script.mediatracker_verifier_mise_a_jour
        - type: custom:button-card
          template: mt_bouton
          name: Redémarrer
          icon: mdi:restart
          tap_action:
            action: call-service
            service: rest_command.mediatracker_redemarrer
            confirmation:
              text: Redémarrer MediaTracker ? Les téléchargements en cours sont mis en pause, puis le conteneur s'arrête pour que Docker le relance.
      - type: markdown
        content: '[Ouvrir MediaTracker]({{ states(''sensor.mediatracker_adresse'') }})'
        card_mod:
          style: |-
            ha-card {
              background: transparent !important;
              box-shadow: none !important;
              border: none !important;
              padding: 0 !important;
            }
            ha-markdown { padding: 0 8px 6px !important; font-size: 12px; color: #9a9aa3; }
  - type: custom:mod-card
    view_layout:
      grid-area: downloads
    card_mod:
      style: |-
        ha-card {
          background: #161618 !important;
          border-radius: 16px !important;
          border: 1px solid rgba(255,255,255,0.06) !important;
          box-shadow: none !important;
          padding: 6px !important;
          margin: 0 !important;
        }
    card:
      type: vertical-stack
      cards:
      - type: custom:mushroom-title-card
        title: Téléchargements
        card_mod:
          style: |-
            ha-card {
              background: transparent !important;
              box-shadow: none !important;
              border: none !important;
              margin: 0 !important;
              --title-padding: 6px 8px 2px;
              --title-font-size: 15px;
            }
      - type: grid
        columns: 2
        square: false
        cards:
        - type: custom:mushroom-entity-card
          entity: sensor.mediatracker_telechargements
          name: Actifs
          icon: mdi:download
          icon_color: blue
          layout: horizontal
          primary_info: name
          secondary_info: state
          card_mod:
            style: |-
              ha-card {
                background: rgba(255,255,255,0.04) !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 12px !important;
                margin: 0 !important;
                --icon-size: 22px;
                --card-primary-font-size: 13px;
                --card-secondary-font-size: 12px;
              }
        - type: custom:mushroom-entity-card
          entity: sensor.mediatracker_progression
          name: Progression
          icon: mdi:progress-download
          icon_color: blue
          layout: horizontal
          primary_info: name
          secondary_info: state
          card_mod:
            style: |-
              ha-card {
                background: rgba(255,255,255,0.04) !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 12px !important;
                margin: 0 !important;
                --icon-size: 22px;
                --card-primary-font-size: 13px;
                --card-secondary-font-size: 12px;
              }
        - type: custom:mushroom-entity-card
          entity: sensor.mediatracker_vitesse
          name: Vitesse
          icon: mdi:speedometer
          icon_color: blue
          layout: horizontal
          primary_info: name
          secondary_info: state
          card_mod:
            style: |-
              ha-card {
                background: rgba(255,255,255,0.04) !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 12px !important;
                margin: 0 !important;
                --icon-size: 22px;
                --card-primary-font-size: 13px;
                --card-secondary-font-size: 12px;
              }
        - type: custom:mushroom-entity-card
          entity: sensor.mediatracker_file
          name: En file
          icon: mdi:playlist-play
          icon_color: blue
          layout: horizontal
          primary_info: name
          secondary_info: state
          card_mod:
            style: |-
              ha-card {
                background: rgba(255,255,255,0.04) !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 12px !important;
                margin: 0 !important;
                --icon-size: 22px;
                --card-primary-font-size: 13px;
                --card-secondary-font-size: 12px;
              }
      - type: conditional
        conditions:
        - condition: numeric_state
          entity: sensor.mediatracker_telechargements
          above: 0
        card:
          type: custom:button-card
          entity: sensor.mediatracker_progression
          show_icon: false
          show_name: false
          show_state: false
          tap_action:
            action: none
          custom_fields:
            bar: '[[[ const p = Math.max(0, Math.min(100, Number(entity.state) || 0)); return `<div style="height:6px;border-radius:3px;background:rgba(255,255,255,0.08);overflow:hidden"><div style="width:${p}%;height:100%;background:#1f6feb"></div></div>`; ]]]'
            txt: '[[[ const p = Number(entity.state) || 0; const v = states[''sensor.mediatracker_vitesse''] ? states[''sensor.mediatracker_vitesse''].state : ''0''; return `${p} % · ${v} Mo/s`; ]]]'
          styles:
            card:
            - padding: 6px 10px
            - background: transparent
            - box-shadow: none
            grid:
            - grid-template-areas: '"bar" "txt"'
            - grid-template-columns: 1fr
            - row-gap: 4px
            custom_fields:
              txt:
              - justify-self: start
              - font-size: 11px
              - color: '#9a9aa3'
      - type: markdown
        content: '{% set d = state_attr(''sensor.mediatracker'', ''downloads'') %}{% if d is mapping and (d.get(''paused'') or d.get(''user_paused'')) %}En pause{% if d.get(''pause_reason'') %} : {{ d.get(''pause_reason'') }}{% elif d.get(''user_paused'') %} (manuelle){% endif %}.{% endif %}'
        card_mod:
          style: |-
            ha-card {
              background: transparent !important;
              box-shadow: none !important;
              border: none !important;
              padding: 0 !important;
            }
            ha-markdown { padding: 0 8px 6px !important; font-size: 12px; color: #9a9aa3; }
      - type: horizontal-stack
        cards:
        - type: custom:button-card
          template: mt_bouton
          name: Pause
          icon: mdi:pause
          tap_action:
            action: call-service
            service: rest_command.mediatracker_pause_telechargements
          styles:
            card:
            - background: '[[[ const d = (states[''sensor.mediatracker''] && states[''sensor.mediatracker''].attributes.downloads) || {}; return (d.paused || d.user_paused) ? ''rgba(31,111,235,0.35)'' : ''rgba(255,255,255,0.06)''; ]]]'
          triggers_update:
          - sensor.mediatracker
          - binary_sensor.nas
        - type: custom:button-card
          template: mt_bouton
          name: Reprendre
          icon: mdi:play
          tap_action:
            action: call-service
            service: rest_command.mediatracker_reprendre_telechargements
  - type: custom:mod-card
    view_layout:
      grid-area: watch
    card_mod:
      style: |-
        ha-card {
          background: #161618 !important;
          border-radius: 16px !important;
          border: 1px solid rgba(255,255,255,0.06) !important;
          box-shadow: none !important;
          padding: 6px !important;
          margin: 0 !important;
        }
    card:
      type: vertical-stack
      cards:
      - type: custom:mushroom-title-card
        title: À voir
        card_mod:
          style: |-
            ha-card {
              background: transparent !important;
              box-shadow: none !important;
              border: none !important;
              margin: 0 !important;
              --title-padding: 6px 8px 2px;
              --title-font-size: 15px;
            }
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr 1fr
          grid-gap: 8px
          place-items: stretch
          mediaquery:
            '(min-width: 840px)':
              grid-template-columns: repeat(2, minmax(0, 1fr))
        card_mod:
          style: |-
            ha-card {
              background: transparent !important;
              box-shadow: none !important;
              border: none !important;
              padding: 0 !important;
              margin: 0 !important;
            }
        cards:
        - type: custom:mushroom-entity-card
          entity: sensor.mediatracker_episodes
          name: Épisodes
          icon: mdi:play
          icon_color: pink
          layout: horizontal
          primary_info: name
          secondary_info: state
          card_mod:
            style: |-
              ha-card {
                background: rgba(255,255,255,0.04) !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 12px !important;
                margin: 0 !important;
                --icon-size: 22px;
                --card-primary-font-size: 13px;
                --card-secondary-font-size: 12px;
              }
        - type: custom:mushroom-entity-card
          entity: sensor.mediatracker_films
          name: Films
          icon: mdi:filmstrip
          icon_color: deep-orange
          layout: horizontal
          primary_info: name
          secondary_info: state
          card_mod:
            style: |-
              ha-card {
                background: rgba(255,255,255,0.04) !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 12px !important;
                margin: 0 !important;
                --icon-size: 22px;
                --card-primary-font-size: 13px;
                --card-secondary-font-size: 12px;
              }
        - type: custom:mushroom-entity-card
          entity: sensor.mediatracker_nouveautes
          name: Nouveautés
          icon: mdi:star
          icon_color: amber
          layout: horizontal
          primary_info: name
          secondary_info: state
          card_mod:
            style: |-
              ha-card {
                background: rgba(255,255,255,0.04) !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 12px !important;
                margin: 0 !important;
                --icon-size: 22px;
                --card-primary-font-size: 13px;
                --card-secondary-font-size: 12px;
              }
          view_layout:
            grid-column: 1 / -1
      - type: markdown
        content: |-
          {% set w = state_attr('sensor.mediatracker', 'to_watch') %}{% set items = (w.get('items') if w is mapping else []) or [] %}{% set up = state_attr('sensor.mediatracker', 'upcoming') or [] %}{% if items | count > 0 %}**Prochains à voir**
          {% for i in items[:5] %}- {{ i.media_title }} · {{ i.label }}
          {% endfor %}{% endif %}{% if up | count > 0 %}
          **À venir**
          {% for u in up[:4] %}- {% if u.air_date is string and u.air_date | length >= 10 %}{{ u.air_date[8:10] }}/{{ u.air_date[5:7] }} · {% endif %}{{ u.media_title }} {{ u.label }}
          {% endfor %}{% endif %}{% set s = state_attr('sensor.mediatracker', 'source_scan') %}{% if s is mapping and s.get('at') %}
          Sources vérifiées le {{ as_local(as_datetime(s.get('at'))).strftime('%d/%m à %H:%M') }} : {{ 'rien de nouveau' if s.get('result') == 'nothing' else (s.get('result') or '—') }}.{% endif %}
        card_mod:
          style: |-
            ha-card {
              background: transparent !important;
              box-shadow: none !important;
              border: none !important;
              padding: 0 !important;
            }
            ha-markdown { padding: 0 8px 6px !important; font-size: 12px; color: #9a9aa3; }
      - type: horizontal-stack
        cards:
        - type: custom:button-card
          template: mt_bouton
          name: Sources
          icon: mdi:radar
          tap_action:
            action: call-service
            service: rest_command.mediatracker_verifier_sources
        - type: custom:button-card
          template: mt_bouton
          name: Actualiser
          icon: mdi:refresh
          tap_action:
            action: call-service
            service: rest_command.mediatracker_actualiser_nouveautes
        - type: custom:button-card
          template: mt_bouton
          name: Bibliothèque
          icon: mdi:folder-search
          tap_action:
            action: call-service
            service: rest_command.mediatracker_scanner_bibliotheque
  - type: custom:mod-card
    view_layout:
      grid-area: sorties
    card_mod:
      style: |-
        ha-card {
          background: #161618 !important;
          border-radius: 16px !important;
          border: 1px solid rgba(255,255,255,0.06) !important;
          box-shadow: none !important;
          padding: 6px !important;
          margin: 0 !important;
        }
    card:
      type: vertical-stack
      cards:
      - type: custom:mushroom-title-card
        title: Sorties numériques
        card_mod:
          style: |-
            ha-card {
              background: transparent !important;
              box-shadow: none !important;
              border: none !important;
              margin: 0 !important;
              --title-padding: 6px 8px 2px;
              --title-font-size: 15px;
            }
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: repeat(auto-fill, 76px)
          grid-auto-rows: 132px
          grid-gap: 8px
          place-content: start
          place-items: start
        card_mod:
          style: |-
            ha-card {
              background: transparent !important;
              box-shadow: none !important;
              border: none !important;
              padding: 0 !important;
              margin: 0 !important;
            }
        cards:
        - type: custom:button-card
          template: mt_affiche
          entity: sensor.mediatracker_sortie_1
          hold_action:
            action: call-service
            service: script.mediatracker_suivre_sortie
            data:
              index: 0
            confirmation:
              text: '[[[ return ''Suivre « '' + String(entity.state).replace('' · suivi'', '''') + '' » dans MediaTracker ?'' ]]]'
        - type: custom:button-card
          template: mt_affiche
          entity: sensor.mediatracker_sortie_2
          hold_action:
            action: call-service
            service: script.mediatracker_suivre_sortie
            data:
