# ─────────────────────────────────────────────────────────────────────────────
#  Dashboard « Maison » — style Nuit flat v3 (exemple anonymisé)
#  Prérequis HACS (frontend) : button-card, Mushroom, card-mod, auto-entities,
#  layout-card. Thème : nuit_flat (themes/ha-themes.yaml).
#  Installation : Paramètres → Tableaux de bord → Ajouter → « Nouveau tableau
#  de bord vide » → ⋮ → Éditeur de configuration brute → coller ce fichier.
#  ⚠ Alarme / caméras : tuiles en LECTURE (tap = fenêtre de détail), aucun
#    bouton armer/désarmer ni bascule directe.
#  Les entity_id sont des exemples génériques : remplace-les par les tiens.
# ─────────────────────────────────────────────────────────────────────────────

button_card_templates:
  # Base commune : tuile plate, filet 1 px, rayon 4 px
  nf_base:
    show_state: true
    styles:
      card:
        - background: var(--nf-panel2)
        - border: 1px solid var(--nf-line)
        - border-radius: 4px
        - box-shadow: none
        - padding: 12px
        - font-family: var(--primary-font-family)
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-columns: 1fr
        - grid-template-rows: min-content 1fr min-content
        - justify-items: start
      img_cell:
        - justify-content: start
        - width: 24px
        - height: 24px
      icon:
        - width: 22px
        - color: var(--nf-muted)
      name:
        - justify-self: start
        - align-self: end
        - font-size: 13px
        - font-weight: 500
        - color: var(--nf-text)
        - margin-top: 14px
      state:
        - justify-self: start
        - font-size: 12px
        - color: var(--nf-muted)

  # Bascule (lumière / prise) : actif = fond pastel transparent, accent coloré
  nf_toggle:
    template: nf_base
    variables:
      accent: var(--nf-mint)
      accent_a: var(--nf-mint-a)
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    styles:
      card:
        - min-height: 96px
    state:
      - value: "on"
        styles:
          card:
            - background: "[[[ return variables.accent_a ]]]"
            - border-color: transparent
          icon:
            - color: "[[[ return variables.accent ]]]"
          state:
            - color: var(--nf-text)
      - value: unavailable
        styles:
          card:
            - opacity: "0.55"

  nf_light:
    template: nf_toggle
    variables:
      accent: var(--nf-peach)
      accent_a: var(--nf-peach-a)

  # Lecture seule (sécurité) : aucun toggle, tap = more-info
  nf_lecture:
    template: nf_base
    tap_action:
      action: more-info
    hold_action:
      action: none
    double_tap_action:
      action: none

  # Valeur chiffrée (énergie, consommables)
  nf_valeur:
    show_icon: false
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    styles:
      card:
        - background: var(--nf-panel2)
        - border: 1px solid var(--nf-line)
        - border-radius: 4px
        - box-shadow: none
        - padding: 12px
      grid:
        - grid-template-areas: '"s" "n"'
        - justify-items: start
      state:
        - font-size: 22px
        - font-weight: 600
        - letter-spacing: -0.02em
        - color: var(--nf-text)
        - font-variant-numeric: tabular-nums
      name:
        - font-size: 12px
        - color: var(--nf-muted)

  # Titre de section : majuscules, gris, filet
  nf_titre:
    show_icon: false
    show_state: false
    tap_action:
      action: none
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - padding: 14px 2px 2px
      name:
        - font-size: 12px
        - font-weight: 600
        - letter-spacing: 0.08em
        - text-transform: uppercase
        - color: var(--nf-muted)
        - justify-self: start
      grid:
        - grid-template-areas: '"n"'
    card_mod:
      style: |
        ha-card::after { content: ""; position: absolute; left: 0; right: 0; bottom: 6px; height: 1px; background: var(--nf-line); z-index: -1; }
        #name { background: var(--nf-bg); padding-right: 8px; }

views:
  - title: Maison
    path: maison
    icon: mdi:home-variant-outline
    theme: nuit_flat
    type: custom:grid-layout
    layout:
      grid-template-columns: repeat(6, minmax(0, 1fr))
      grid-gap: 12px
      padding: 4px 8px 24px
      max-width: 1180px
      mediaquery:
        "(max-width: 760px)":
          grid-template-columns: repeat(2, minmax(0, 1fr))
          padding: 4px 4px 24px
    cards:
      # ── En-tête : puces d'état ────────────────────────────────────────────
      - type: custom:mushroom-title-card
        title: Bonsoir
        subtitle: "{{ states('weather.forecast_maison') | replace('cloudy','Nuageux') }} · {{ state_attr('weather.forecast_maison','temperature') }} °C · coucher {{ as_timestamp(state_attr('sun.sun','next_setting')) | timestamp_custom('%H:%M') }}"
        view_layout: { grid-column: 1 / -1 }
      - type: custom:mushroom-chips-card
        view_layout: { grid-column: 1 / -1 }
        chips:
          - type: entity
            entity: alarm_control_panel.alarme_maison
            name: Alarme
            content_info: state
            tap_action: { action: more-info }
          - type: entity
            entity: person.personne_1
            content_info: state
          - type: weather
            entity: weather.forecast_maison
            show_conditions: true
            show_temperature: true
          - type: entity
            entity: sensor.garage_prise_serveur_consommation_actuelle
            icon: mdi:server
          - type: template
            icon: mdi:cloud-check-outline
            icon_color: "{{ 'green' if (now() - as_datetime(states('sensor.backup_derniere_sauvegarde_automatique_reussie'))).total_seconds() < 129600 else 'red' }}"
            content: "Sauvegarde {{ as_timestamp(states('sensor.backup_derniere_sauvegarde_automatique_reussie')) | timestamp_custom('%d/%m %H:%M') }}"
          - type: template
            icon: mdi:package-up
            icon_color: orange
            content: "{{ states.update | selectattr('state','eq','on') | list | count }} mises à jour"
            tap_action: { action: navigate, navigation_path: /config/updates }

      # ── Sécurité (lecture seule) ─────────────────────────────────────────
      - type: custom:button-card
        template: nf_titre
        name: Sécurité
        view_layout: { grid-column: 1 / -1 }
      - type: custom:button-card
        template: nf_lecture
        entity: alarm_control_panel.alarme_maison
        name: Alarme
        icon: mdi:shield-home-outline
        view_layout: { grid-column: span 2 }
        state_display: >
          [[[ return {disarmed:'Désarmée', armed_away:'Armée (absence)', armed_home:'Armée (présence)',
                      armed_night:'Armée (nuit)', pending:'En attente', arming:'Armement…', triggered:'DÉCLENCHÉE'}[entity.state] || entity.state ]]]
        styles:
          card: [border-top: 3px solid var(--nf-mint), min-height: 110px]
          icon: [color: var(--nf-mint)]
          state: [font-size: 18px, font-weight: 600, color: var(--nf-text)]
        state:
          - value: triggered
            styles:
              card: [border-top: 3px solid var(--nf-rose), background: var(--nf-rose-a)]
              icon: [color: var(--nf-rose)]
          - operator: template
            value: "[[[ return entity.state.startsWith('armed') ]]]"
            styles:
              card: [border-top: 3px solid var(--nf-lavender)]
              icon: [color: var(--nf-lavender)]
      - type: custom:button-card
        template: nf_lecture
        entity: switch.cameras
        name: Prises caméras
        icon: mdi:cctv
        state_display: "[[[ return entity.state === 'on' ? 'Alimentées' : 'Coupées' ]]]"
        state:
          - value: "on"
            styles: { icon: [color: var(--nf-lavender)] }
      - type: custom:button-card
        template: nf_lecture
        entity: binary_sensor.mouvement_bureau
        name: MVT Bureau
        icon: mdi:motion-sensor
        state_display: "[[[ return entity.state === 'on' ? 'Mouvement' : 'Calme' ]]]"
        state:
          - value: "on"
            styles:
              card: [background: var(--nf-peach-a), border-color: transparent]
              icon: [color: var(--nf-peach)]
      - type: custom:button-card
        template: nf_lecture
        entity: person.personne_1
        name: Personne 1
        icon: mdi:account-outline
        state_display: "[[[ return entity.state === 'home' ? 'À la maison' : 'Absent' ]]]"
      - type: custom:button-card
        template: nf_lecture
        entity: person.personne_2
        name: Personne 2
        icon: mdi:account-outline
        state_display: "[[[ return entity.state === 'home' ? 'À la maison' : (entity.state === 'unknown' ? 'Inconnu' : 'Absente') ]]]"
      - type: picture-entity
        entity: camera.camera_bureau
        name: Caméra Bureau
        camera_view: auto
        show_state: false
        tap_action: { action: more-info }
        view_layout: { grid-column: span 3 }
      - type: picture-entity
        entity: camera.camera_exterieur
        name: Caméra Extérieur
        camera_view: auto
        show_state: false
        tap_action: { action: more-info }
        view_layout: { grid-column: span 3 }

      # ── Lumières (groupes de lumières) ──────────────────────────
      - type: custom:button-card
        template: nf_titre
        name: Lumières
        view_layout: { grid-column: 1 / -1 }
      - { type: custom:button-card, template: nf_light, entity: light.bureau, name: Bureau, icon: mdi:desk-lamp }
      - { type: custom:button-card, template: nf_light, entity: light.salle_a_manger, name: Salle à manger, icon: mdi:ceiling-light-outline }
      - { type: custom:button-card, template: nf_light, entity: light.chambre, name: Chambre, icon: mdi:bed-outline }
      - { type: custom:button-card, template: nf_light, entity: light.sdb, name: Salle de bain, icon: mdi:shower-head }
      - { type: custom:button-card, template: nf_light, entity: light.garage, name: Garage, icon: mdi:garage-variant }
      - type: custom:button-card
        template: nf_base
        name: Tout éteindre
        icon: mdi:lightbulb-group-off-outline
        show_state: false
        tap_action:
          action: perform-action
          perform_action: light.turn_off
          target:
            entity_id: [light.bureau, light.salle_a_manger, light.chambre, light.sdb, light.garage]
          confirmation:
            text: Éteindre toutes les lumières ?

      # ── Prises (auto-entities, hors baie serveur et caméras) ─────────────
      - type: custom:button-card
        template: nf_titre
        name: Prises
        view_layout: { grid-column: 1 / -1 }
      - type: custom:auto-entities
        view_layout: { grid-column: 1 / -1 }
        card:
          type: custom:layout-card
          layout_type: custom:grid-layout
          layout:
            grid-template-columns: repeat(6, minmax(0, 1fr))
            grid-gap: 12px
            margin: 0
            mediaquery:
              "(max-width: 760px)":
                grid-template-columns: repeat(2, minmax(0, 1fr))
        card_param: cards
        filter:
          include:
            - entity_id: switch.switch_bureau_pc
            - entity_id: switch.switch_meuble_tele
            - entity_id: switch.switch_chambre_tv
            - entity_id: switch.switch_imprimante3d
            - entity_id: switch.switch_imprimante_laser
            - entity_id: switch.prise_aspirateur
              options: { name: Roborock }
          exclude:
            - entity_id: "*camera*"
            - entity_id: switch.garage_prise_serveur
        sort: { method: state, reverse: true }
        options:
          type: custom:button-card
          template: nf_toggle
          icon: mdi:power-socket-fr

      # ── Baie serveur ─────────────────────────────────────────────────────
      - type: custom:button-card
        template: nf_titre
        name: Baie serveur
        view_layout: { grid-column: 1 / -1 }
      - type: custom:button-card
        template: nf_lecture
        entity: switch.garage_prise_serveur
        name: Prise serveur
        icon: mdi:server
        state_display: >
          [[[ return (entity.state === 'on' ? 'Alimentée' : 'COUPÉE') + ' · ping ' +
             (states['binary_sensor.serveur'].state === 'on' ? 'OK' : 'perdu') ]]]
        styles:
          card: [border-top: 3px solid var(--nf-blue)]
          icon: [color: var(--nf-blue)]
      - { type: custom:button-card, template: nf_valeur, entity: sensor.garage_prise_serveur_consommation_actuelle, name: Puissance }
      - { type: custom:button-card, template: nf_valeur, entity: sensor.garage_prise_serveur_tension, name: Tension }
      - { type: custom:button-card, template: nf_valeur, entity: sensor.garage_prise_serveur_consommation_d_aujourd_hui, name: Aujourd'hui }
      - { type: custom:button-card, template: nf_valeur, entity: sensor.garage_prise_serveur_la_consommation_de_ce_mois_ci, name: Ce mois-ci }
      - type: custom:button-card
        template: nf_valeur
        entity: binary_sensor.nas
        name: NAS (ping)
        state_display: "[[[ return entity.state === 'on' ? 'En ligne' : 'Éteint' ]]]"
      - type: history-graph
        title: Puissance serveur — 24 h
        hours_to_show: 24
        entities:
          - entity: sensor.garage_prise_serveur_consommation_actuelle
            name: Puissance
        view_layout: { grid-column: 1 / -1 }
        card_mod:
          style: |
            ha-card { --graph-color-1: var(--nf-blue); }

      # ── Roborock ─────────────────────────────────────────────────────────
      - type: custom:button-card
        template: nf_titre
        name: Roborock Q7 L5+
        view_layout: { grid-column: 1 / -1 }
      - type: custom:mushroom-vacuum-card
        entity: vacuum.aspirateur
        name: Roborock
        icon_animation: true
        commands: [start_pause, stop, return_home, locate]
        view_layout: { grid-column: span 2 }
      - type: custom:auto-entities
        view_layout: { grid-column: span 4 }
        card:
          type: grid
          columns: 4
          square: false
        card_param: cards
        filter:
          include:
            - entity_id: sensor.aspirateur_temps_restant_*
            - entity_id: sensor.aspirateur_mop_life_time_left
        sort: { method: state, numeric: true }
        options:
          type: custom:button-card
          template: nf_valeur
          name: >
            [[[ return entity.attributes.friendly_name.replace('Roborock Q7 L5+ ','')
                 .replace('Temps restant ','').replace('Durée de vie restante de la ','') ]]]
          state_display: "[[[ return Number(entity.state).toFixed(0) + ' h' ]]]"
          styles:
            card:
              - border-left: >
                  [[[ return Number(entity.state) < 10 ? '3px solid var(--nf-rose)'
                     : Number(entity.state) < 50 ? '3px solid var(--nf-peach)' : '3px solid var(--nf-mint)' ]]]

      # ── Batteries (auto-entities, triées) ───────────────────────────────
      - type: custom:button-card
        template: nf_titre
        name: Batteries
        view_layout: { grid-column: 1 / -1 }
      - type: custom:auto-entities
        view_layout: { grid-column: 1 / -1 }
        card:
          type: custom:layout-card
          layout_type: custom:grid-layout
          layout:
            grid-template-columns: repeat(4, minmax(0, 1fr))
            grid-gap: 8px
            mediaquery:
              "(max-width: 760px)":
                grid-template-columns: repeat(2, minmax(0, 1fr))
        card_param: cards
        filter:
          include:
            - attributes: { device_class: battery }
              domain: sensor
          exclude:
            - entity_id: sensor.ancien_telephone_*  # exemple : exclure un appareil retiré
            - entity_id: sensor.aspirateur_*
        sort: { method: state, numeric: true }
        show_empty: false
        options:
          type: custom:mushroom-entity-card
          icon_color: >-
            {% set b = states(config.entity) %}
            {{ 'grey' if not b | is_number else 'red' if b|int < 20 else 'orange' if b|int < 40 else 'green' }}
          card_mod:
            style: |
              ha-card { background: var(--nf-panel2); }

      # ── Système ──────────────────────────────────────────────────────────
      - type: custom:button-card
        template: nf_titre
        name: Système
        view_layout: { grid-column: 1 / -1 }
      - type: custom:auto-entities
        view_layout: { grid-column: span 3 }
        card:
          type: entities
          title: Mises à jour disponibles
          state_color: true
        filter:
          include:
            - domain: update
              state: "on"
        show_empty: true
        empty:
          type: markdown
          content: "Tout est à jour."
      - type: entities
        title: Sauvegardes
        view_layout: { grid-column: span 3 }
        entities:
          - entity: sensor.backup_derniere_sauvegarde_automatique_reussie
            name: Dernière réussie
          - entity: sensor.backup_prochaine_sauvegarde_automatique_programmee
            name: Prochaine
          - entity: sensor.backup_etat_du_gestionnaire_de_sauvegarde
            name: État
