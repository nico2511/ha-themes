- title: Téléchargements
  path: telechargements
  type: sections
  icon: mdi:download
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: markdown
      content: '<ha-alert alert-type="warning" title="NAS éteint">NAS éteint : les chiffres sont figés. Un suivi demandé maintenant part en file d''attente et s''envoie dès que le NAS répond.</ha-alert>'
      grid_options:
        columns: full
    column_span: 2
    visibility:
    - condition: state
      entity: binary_sensor.nas
      state: 'off'
  - type: grid
    cards:
    - type: markdown
      content: '{% set h = state_attr(''sensor.mediatracker'', ''health'') %}<ha-alert alert-type="error" title="Santé : {{ states(''sensor.mediatracker_sante'') }}">{% if h is mapping and h.get(''component'') %}{{ h.get(''component'') }}{% endif %}{% if h is mapping and h.get(''message'') %} — {{ h.get(''message'') }}{% endif %}</ha-alert>'
      grid_options:
        columns: full
    column_span: 2
    visibility:
    - condition: state
      entity: binary_sensor.nas
      state: 'on'
    - condition: state
      entity: sensor.mediatracker_sante
      state_not: ok
  - type: grid
    cards:
    - type: heading
      heading: En cours
      heading_style: title
      icon: mdi:download
    - type: tile
      entity: sensor.mediatracker_telechargements
      name: Actifs
      icon: mdi:download
      color: blue
      vertical: true
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.mediatracker_file
      name: En file
      icon: mdi:playlist-play
      color: blue
      vertical: true
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.mediatracker_vitesse
      name: Vitesse
      icon: mdi:speedometer
      color: blue
      vertical: true
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.mediatracker_progression
      name: Progression
      icon: mdi:progress-download
      color: blue
      features:
      - type: bar-gauge
        min: 0
        max: 100
      grid_options:
        columns: 12
    - type: markdown
      content: |-
        {% set d = state_attr('sensor.mediatracker', 'downloads') %}{% set d = d if d is mapping else {} %}{% set n = states('sensor.mediatracker_telechargements') | int(0) %}{% if n > 0 %}**{{ n }}** en cours · {{ states('sensor.mediatracker_progression') }} % · {{ states('sensor.mediatracker_vitesse') }} Mo/s{% else %}Aucun téléchargement en cours.{% endif %}{% if d.get('paused') or d.get('user_paused') %}

        ⏸ En pause{% if d.get('pause_reason') %} : {{ d.get('pause_reason') }}{% elif d.get('user_paused') %} (manuelle){% endif %}.{% endif %}
      grid_options:
        columns: full
    background: true
  - type: grid
    cards:
    - type: heading
      heading: Contrôle
      heading_style: title
      icon: mdi:play-pause
    - type: shortcut
      text: Pause
      icon: mdi:pause
      grid_options:
        columns: 6
        rows: 1
      color: amber
      tap_action:
        action: perform-action
        perform_action: rest_command.mediatracker_pause_telechargements
    - type: shortcut
      text: Reprendre
      icon: mdi:play
      grid_options:
        columns: 6
        rows: 1
      color: green
      tap_action:
        action: perform-action
        perform_action: rest_command.mediatracker_reprendre_telechargements
    - type: heading
      heading: File de téléchargement
      heading_style: subtitle
      icon: mdi:playlist-play
    - type: markdown
      content: |-
        {% set q = state_attr('sensor.mediatracker', 'queue') %}{% set qi = (q.get('items') if q is mapping else []) or [] %}{% if qi | count > 0 %}{% for i in qi[:8] %}- {% if i is mapping %}{{ i.get('title') or i.get('media_title') or i.get('name') or '—' }}{% if i.get('label') %} {{ i.get('label') }}{% endif %}{% else %}{{ i }}{% endif %}
        {% endfor %}{% else %}File de téléchargement vide.{% endif %}
      grid_options:
        columns: full
    background: true
  subview: true
  back_path: /dashboard-mediatracker/mediatracker
