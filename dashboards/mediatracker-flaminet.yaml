    cards:
    - type: heading
      heading: État
      heading_style: title
      icon: mdi:heart-pulse
    - type: tile
      entity: sensor.mediatracker_sante
      name: Santé
      icon: mdi:heart-pulse
      color: green
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.mediatracker_disque
      name: Disque libre
      icon: mdi:harddisk
      color: amber
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.mediatracker_version
      name: Version
      icon: mdi:tag-outline
      color: purple
      grid_options:
        columns: 12
    - type: tile
      entity: binary_sensor.nas
      name: NAS
      icon: mdi:nas
      grid_options:
        columns: 12
    - type: markdown
      content: |-
        {% set u = state_attr('sensor.mediatracker', 'update') %}{% if u is mapping and u.get('available') %}**Mise à jour disponible**{% if u.get('detail') %} : {{ u.get('detail') }}{% endif %}.{% else %}Aucune mise à jour signalée.{% endif %}{% if u is mapping and u.get('checked_at') %} Vérifié le {{ as_local(as_datetime(u.get('checked_at'))).strftime('%d/%m à %H:%M') }}.{% endif %}{% set b = state_attr('sensor.mediatracker', 'library_scan_at') %}{% if b %}

        Dernier scan de la bibliothèque : {{ as_local(as_datetime(b)).strftime('%d/%m à %H:%M') }}.{% endif %}

