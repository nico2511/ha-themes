    cards:
    - type: markdown
      content: '{% set h = state_attr(''sensor.mediatracker'', ''health'') %}<ha-alert alert-type="error" title="Santé : {{ states(''sensor.mediatracker_sante'') }}">{% if h is mapping and h.get(''component'') %}{{ h.get(''component'') }}{% endif %}{% if h is mapping and h.get(''message'') %} — {{ h.get(''message'') }}{% endif %}</ha-alert>'
