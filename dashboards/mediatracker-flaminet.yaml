# Dashboard « MediaTracker » v7 — style Flaminet (natif HA + modèles button-card)
# URL supposée : /dashboard-mediatracker (adapter les navigation_path à ton URL).
# Le raccourci « Flaminet » pointe vers /dashboard-maison/home : à adapter aussi.
# Prérequis : button-card, Mushroom (badge MAJ), card-mod (champs sombres de « Suivre »).
# Entités : intégration/package MediaTracker (sensor.mediatracker*, input_*, script.mediatracker_*).
# Accueil léger (path mediatracker) + 5 sous-vues. À coller dans l'éditeur de configuration brute (remplace tout).
# Aucun secret ni IP.
title: MediaTracker
button_card_templates:
  mt_affiche:
    icon: mdi:image-outline
    show_entity_picture: true
    show_icon: true
    show_name: false
    show_state: true
    size: 100%
    entity_picture: '[[[ const picture = String((entity.attributes && entity.attributes.entity_picture) || ''''); return /^https?:\/\//.test(picture) ? picture : ''''; ]]]'
    tap_action:
      action: url
      url_path: '[[[ return entity.attributes.tmdb_url || '''' ]]]'
    styles:
      card:
      - padding: 6px
      - box-shadow: none
      - background: var(--ha-card-background, var(--card-background-color))
      - border-radius: var(--ha-card-border-radius, 12px)
      - border: '[[[ return String(entity.state).endsWith(''· suivi'') ? ''1px solid rgba(134,239,172,0.65)'' : ''1px solid var(--ha-card-border-color, var(--divider-color, rgba(255,255,255,0.12)))'' ]]]'
      - display: '[[[ const s = entity ? String(entity.state) : ''''; return [''—'',''unknown'',''unavailable'',''''].includes(s) ? ''none'' : ''block'' ]]]'
      grid:
      - grid-template-areas: '"i" "s"'
      - grid-template-columns: 1fr
      - grid-template-rows: auto auto
      - row-gap: 6px
      img_cell:
      - width: 100%
      - aspect-ratio: 2 / 3
      - overflow: hidden
      - border-radius: 8px
      - background: var(--secondary-background-color, rgba(255,255,255,0.05))
      entity_picture:
      - width: 100%
      - height: 100%
      - object-fit: cover
      - border-radius: 8px
      icon:
      - width: 32px
      - color: var(--secondary-text-color)
      state:
      - font-size: 12px
      - font-weight: '500'
      - line-height: 15px
      - white-space: normal
      - overflow: hidden
      - max-height: 30px
      - text-align: center
      - justify-self: center
      - color: '[[[ return String(entity.state).endsWith(''· suivi'') ? ''#86efac'' : ''var(--primary-text-color)'' ]]]'
  mt_attente:
    show_icon: true
    show_name: false
    show_state: false
    icon: mdi:bookmark-outline
    size: 20px
    tap_action:
      action: more-info
    custom_fields:
      id: '[[[ return entity.attributes.label || ''TMDB'' ]]]'
      type: '[[[ const t = entity.attributes.type; return (t && t !== ''—'') ? t : '''' ]]]'
      badge: '[[[ return entity.state ]]]'
    styles:
      card:
      - padding: 10px 12px
      - box-shadow: none
      - background: var(--ha-card-background, var(--card-background-color))
      - border-radius: var(--ha-card-border-radius, 12px)
      - border: 1px solid var(--ha-card-border-color, var(--divider-color, rgba(255,255,255,0.12)))
      grid:
      - grid-template-areas: '"i id badge" "i type badge"'
      - grid-template-columns: 36px 1fr auto
      - column-gap: 10px
      - align-items: center
      img_cell:
      - width: 36px
      - height: 36px
      - border-radius: 50%
      - background: rgba(255,152,0,0.2)
      icon:
      - color: rgb(255,152,0)
      custom_fields:
        id:
        - justify-self: start
        - font-size: 14px
        - font-weight: '500'
        type:
        - justify-self: start
        - font-size: 12px
        - color: var(--secondary-text-color)
        badge:
        - justify-self: end
        - font-size: 11px
        - font-weight: '600'
        - padding: 3px 8px
        - border-radius: 999px
        - background: '[[[ return entity.state == ''envoyé'' ? ''#14532d'' : ''#7c4a03'' ]]]'
        - color: '[[[ return entity.state == ''envoyé'' ? ''#86efac'' : ''#fdba74'' ]]]'
  mt_liste:
    entity: sensor.mediatracker
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    triggers_update:
    - sensor.mediatracker
    tap_action:
      action: none
    hold_action:
      action: none
    variables:
      kind: to_watch
      vide: Rien à voir pour l'instant.
      icone: mdi:television-play
      couleur: '#f48fb1'
      fond: rgba(244,143,177,0.15)
    custom_fields:
      liste: |-
        [[[
        const a = (states['sensor.mediatracker'] && states['sensor.mediatracker'].attributes) || {};
        const esc = (x) => String(x == null ? '' : x).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
        let rows = [];
        if (variables.kind === 'to_watch') {
          const w = a.to_watch || {};
          rows = (w.items || []).slice(0, 8).map((i) => ({ t: i.media_title, s: (i.label || '') + (i.title ? ' · ' + i.title : ''), r: '' }));
        } else {
          rows = (a.upcoming || []).slice(0, 8).map((u) => ({ t: u.media_title, s: u.label || '', r: (typeof u.air_date === 'string' && u.air_date.length >= 10) ? u.air_date.slice(8, 10) + '/' + u.air_date.slice(5, 7) : '' }));
        }
        if (!rows.length) return `<div style="padding:10px 4px;color:var(--secondary-text-color);font-size:13px">${esc(variables.vide)}</div>`;
        return `<div style="display:flex;flex-direction:column;gap:6px">` + rows.map((x) => `
          <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid var(--ha-card-border-color, var(--divider-color, rgba(255,255,255,0.10)))">
            <div style="flex:0 0 32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:${variables.fond}">
              <ha-icon icon="${variables.icone}" style="--mdc-icon-size:18px;color:${variables.couleur}"></ha-icon>
            </div>
            <div style="flex:1;min-width:0;text-align:left">
              <div style="font-size:14px;font-weight:600;color:var(--primary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.t)}</div>
              <div style="font-size:12px;color:var(--secondary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.s)}</div>
            </div>
            ${x.r ? `<div style="flex:0 0 auto;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;background:${variables.fond};color:${variables.couleur}">${esc(x.r)}</div>` : ''}
          </div>`).join('') + `</div>`;
        ]]]
    styles:
      card:
      - padding: '0'
      - background: none
      - box-shadow: none
      - border: none
      grid:
      - grid-template-areas: '"liste"'
      - grid-template-columns: 1fr
      custom_fields:
        liste:
        - width: 100%
views:
- title: MediaTracker
  path: mediatracker
  type: sections
  icon: mdi:movie-open-play
  max_columns: 2
  header:
    layout: responsive
    badges_position: bottom
    card:
      type: markdown
      text_only: true
      content: |-
        {% set j = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'] %}{% set m = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'] %}# MediaTracker

        {{ j[now().weekday()] }} {{ now().day }} {{ m[now().month - 1] }} · {{ 'NAS allumé' if is_state('binary_sensor.nas', 'on') else 'NAS éteint' }} · {{ 'santé ok' if is_state('sensor.mediatracker_sante', 'ok') else 'santé : ' ~ states('sensor.mediatracker_sante') }}
  badges:
  - type: entity
    entity: binary_sensor.nas
    name: NAS
    show_name: true
    show_state: true
    icon: mdi:nas
  - type: custom:mushroom-template-badge
    entity: sensor.mediatracker
    label: MAJ
    icon: '{% set u = state_attr(''sensor.mediatracker'', ''update'') %}{{ ''mdi:arrow-up-circle'' if u is mapping and u.get(''available'') else ''mdi:check-circle-outline'' }}'
    color: '{% set u = state_attr(''sensor.mediatracker'', ''update'') %}{{ ''amber'' if u is mapping and u.get(''available'') else ''green'' }}'
    content: '{% set u = state_attr(''sensor.mediatracker'', ''update'') %}{{ ''Disponible'' if u is mapping and u.get(''available'') else ''À jour'' }}'
    tap_action:
      action: navigate
      navigation_path: /dashboard-mediatracker/systeme
  - type: entity
    entity: sensor.mediatracker_sante
    name: Santé
    show_name: true
    show_state: true
    icon: mdi:heart-pulse
  - type: entity
    entity: sensor.mediatracker_version
    name: Version
    show_name: true
    show_state: true
    icon: mdi:tag-outline
  sections:
  - type: grid
    cards:
    - type: markdown
      content: '<ha-alert alert-type="warning" title="NAS éteint">NAS éteint : les chiffres sont figés. Un suivi demandé maintenant part en file d''attente et s''envoie dès que le NAS répond.</ha-alert>'
      grid_options:
        columns: full
    column_span: 2
    visibility:
    - condition: state
      entity: binary_sensor.nas
      state: 'off'
  - type: grid
    cards:
    - type: markdown
      content: '{% set h = state_attr(''sensor.mediatracker'', ''health'') %}<ha-alert alert-type="error" title="Santé : {{ states(''sensor.mediatracker_sante'') }}">{% if h is mapping and h.get(''component'') %}{{ h.get(''component'') }}{% endif %}{% if h is mapping and h.get(''message'') %} — {{ h.get(''message'') }}{% endif %}</ha-alert>'
      grid_options:
        columns: full
    column_span: 2
    visibility:
    - condition: state
      entity: binary_sensor.nas
      state: 'on'
    - condition: state
      entity: sensor.mediatracker_sante
      state_not: ok
  - type: grid
    cards:
    - type: heading
      heading: À voir
      heading_style: title
      icon: mdi:play-box-multiple
      tap_action:
        action: navigate
        navigation_path: /dashboard-mediatracker/a-voir
    - type: tile
      entity: sensor.mediatracker_episodes
      name: Épisodes
      icon: mdi:television-play
      color: pink
      vertical: true
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.mediatracker_films
      name: Films
      icon: mdi:filmstrip
      color: deep-orange
      vertical: true
      grid_options:
        columns: 4
    - type: tile
      entity: sensor.mediatracker_nouveautes
      name: Nouveautés
      icon: mdi:star
      color: amber
      vertical: true
      grid_options:
        columns: 4
    - type: markdown
      content: |-
        {% set w = state_attr('sensor.mediatracker', 'to_watch') %}{% set items = (w.get('items') if w is mapping else []) or [] %}{% set up = state_attr('sensor.mediatracker', 'upcoming') or [] %}{% if items | count > 0 %}**Prochain à voir** · {{ items[0].media_title }} {{ items[0].label }}{% else %}Rien à voir pour l'instant.{% endif %}{% if up | count > 0 %}{% set u = up[0] %}

        **Prochaine diffusion** · {% if u.air_date is string and u.air_date | length >= 10 %}{{ u.air_date[8:10] }}/{{ u.air_date[5:7] }} · {% endif %}{{ u.media_title }} {{ u.label }}{% endif %}
      grid_options:
        columns: full
    background: true
  - type: grid
    cards:
    - type: heading
      heading: Téléchargements
      heading_style: title
      icon: mdi:download
      tap_action:
        action: navigate
        navigation_path: /dashboard-mediatracker/telechargements
    - type: tile
      entity: sensor.mediatracker_telechargements
      name: Actifs
      icon: mdi:download
      color: blue
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.mediatracker_file
      name: En file
      icon: mdi:playlist-play
      color: blue
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.mediatracker_progression
      name: Progression
      icon: mdi:progress-download
      color: blue
      features:
      - type: bar-gauge
        min: 0
        max: 100
      grid_options:
        columns: 12
      visibility:
      - condition: numeric_state
        entity: sensor.mediatracker_telechargements
        above: 0
    - type: markdown
      content: |-
        {% set d = state_attr('sensor.mediatracker', 'downloads') %}{% set d = d if d is mapping else {} %}{% set n = states('sensor.mediatracker_telechargements') | int(0) %}{% if n > 0 %}**{{ n }}** en cours · {{ states('sensor.mediatracker_progression') }} % · {{ states('sensor.mediatracker_vitesse') }} Mo/s{% else %}Aucun téléchargement en cours.{% endif %}{% if d.get('paused') or d.get('user_paused') %}

        ⏸ En pause{% if d.get('pause_reason') %} : {{ d.get('pause_reason') }}{% elif d.get('user_paused') %} (manuelle){% endif %}.{% endif %}
      grid_options:
        columns: full
    background: true
  - type: grid
    cards:
    - type: heading
      heading: Aller à
      heading_style: title
      icon: mdi:arrow-right-bold-circle
    - type: shortcut
      text: À voir
      icon: mdi:play-box-multiple
      grid_options:
        columns: 6
        rows: 1
      color: pink
      tap_action:
        action: navigate
        navigation_path: /dashboard-mediatracker/a-voir
    - type: shortcut
      text: Sorties
      icon: mdi:filmstrip-box-multiple
      grid_options:
        columns: 6
        rows: 1
      color: deep-orange
      tap_action:
        action: navigate
        navigation_path: /dashboard-mediatracker/sorties
    - type: shortcut
      text: Téléchargements
      icon: mdi:download
      grid_options:
        columns: 6
        rows: 1
      color: blue
      tap_action:
        action: navigate
        navigation_path: /dashboard-mediatracker/telechargements
    - type: shortcut
      text: Suivre
      icon: mdi:bookmark-plus
      grid_options:
        columns: 6
        rows: 1
      color: green
      tap_action:
        action: navigate
        navigation_path: /dashboard-mediatracker/suivre
    - type: shortcut
      text: Système
      icon: mdi:cog
      grid_options:
        columns: 6
        rows: 1
      tap_action:
        action: navigate
        navigation_path: /dashboard-mediatracker/systeme
    - type: shortcut
      text: Flaminet
      icon: mdi:home-heart
      grid_options:
        columns: 6
        rows: 1
      color: purple
      tap_action:
        action: navigate
        navigation_path: /dashboard-maison/home
    column_span: 2
    background: true
